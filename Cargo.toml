[package]
name = "traytemp"
version = "1.0.0"
edition = "2021"
description = "Temperatura da CPU (por núcleo) e da GPU na bandeja do Windows"

[[bin]]
name = "TrayTemp"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
